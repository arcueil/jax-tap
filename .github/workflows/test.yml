name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs full history to derive version from git tags
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --dev
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs full history to derive version from git tags
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --dev
      - run: uv run pytest -q
      # tests/test_multidevice.py skips on one device; rerun it on two
      # simulated CPU devices so sharding/shard_map/pmap paths run in CI.
      - run: uv run pytest -q tests/test_multidevice.py
        env:
          XLA_FLAGS: --xla_force_host_platform_device_count=2
          JAXTAP_REQUIRE_MULTIDEVICE: "1"
